name: Metrics

on:
  schedule:
    # every 6 hours
    - cron: "0 */6 * * *"
  workflow_dispatch:
  # NOTE: no `push` trigger on purpose. This workflow commits with a PAT, and
  # PAT commits DO re-trigger workflows, so a push trigger makes it loop forever
  # until the API rate limit is hit and every run fails.

permissions:
  contents: write

concurrency:
  group: metrics
  cancel-in-progress: false

jobs:
  metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Fail early with a readable message instead of a cryptic plugin error
      - name: Check METRICS_TOKEN
        env:
          T: ${{ secrets.METRICS_TOKEN }}
        run: |
          if [ -z "$T" ]; then
            echo "::error::Secret METRICS_TOKEN is missing. Repo > Settings > Secrets and variables > Actions > New repository secret."
            exit 1
          fi
          code=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $T" https://api.github.com/user)
          if [ "$code" != "200" ]; then
            echo "::error::METRICS_TOKEN was rejected by GitHub (HTTP $code). It is expired, revoked or copied wrong. Create a new classic PAT."
            exit 1
          fi

      # ---- 3D isometric contribution calendar ----
      - name: Isometric contribution calendar
        id: iso
        continue-on-error: true
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: realsunil
          filename: assets/metrics.isocalendar.svg
          output_action: commit
          committer_branch: main
          committer_message: "chore: update isocalendar [skip ci]"
          retries: 3
          retries_delay: 60
          base: ""
          config_timezone: Asia/Kolkata
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

      # ---- Coding habits ----
      - name: Coding habits
        id: habits
        continue-on-error: true
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: realsunil
          filename: assets/metrics.habits.svg
          output_action: commit
          committer_branch: main
          committer_message: "chore: update habits [skip ci]"
          retries: 3
          retries_delay: 60
          base: ""
          config_timezone: Asia/Kolkata
          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_days: 14
          plugin_habits_facts: yes
          plugin_habits_charts: yes
          plugin_habits_trim: yes

      # ---- Languages ----
      - name: Languages
        id: langs
        continue-on-error: true
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: realsunil
          filename: assets/metrics.languages.svg
          output_action: commit
          committer_branch: main
          committer_message: "chore: update languages [skip ci]"
          retries: 3
          retries_delay: 60
          base: ""
          config_timezone: Asia/Kolkata
          plugin_languages: yes
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 8
          plugin_languages_indepth: no
          plugin_languages_sections: most-used

      # ---- Achievements ----
      - name: Achievements
        id: achievements
        continue-on-error: true
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: realsunil
          filename: assets/metrics.achievements.svg
          output_action: commit
          committer_branch: main
          committer_message: "chore: update achievements [skip ci]"
          retries: 3
          retries_delay: 60
          base: ""
          config_timezone: Asia/Kolkata
          plugin_achievements: yes
          plugin_achievements_threshold: C
          plugin_achievements_secrets: yes
          plugin_achievements_display: compact
          plugin_achievements_limit: 0

      # One plugin failing no longer blocks the others; still report it here
      - name: Report failed plugins
        if: ${{ always() }}
        run: |
          echo "iso=${{ steps.iso.outcome }} habits=${{ steps.habits.outcome }} langs=${{ steps.langs.outcome }} achievements=${{ steps.achievements.outcome }}"
          if [ "${{ steps.iso.outcome }}" = "failure" ] || [ "${{ steps.habits.outcome }}" = "failure" ] || \
             [ "${{ steps.langs.outcome }}" = "failure" ] || [ "${{ steps.achievements.outcome }}" = "failure" ]; then
            echo "::error::At least one metrics plugin failed, open its step above for the log."
            exit 1
          fi
